name: 生成生活注脚

on:
  push:
    paths:
      - 'content/**.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-notes
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate daily notes with AI
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: python .github/scripts/generate_notes.py